<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">EntraCompass architecture</title>
  <desc id="d">The app runs in the administrator's browser. It signs in to Microsoft Entra ID with PKCE, reads Microsoft Graph directly (Conditional Access, apps, permissions, AI agents, labels), optionally opens a Purview export file the administrator created with PowerShell, and keeps data in sessionStorage. Cloudflare only serves the app files and, optionally, an AI endpoint that receives an aggregated summary.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  </defs>
  <rect width="1000" height="760" rx="14" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0f172a">EntraCompass architecture</text>
  <text x="30" y="60" font-size="12.5" fill="#475569">Browser-only, read-only. Tenant data flows only between your browser, Microsoft and files on your own device.</text>

  <!-- Browser -->
  <rect x="30" y="80" width="410" height="594" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="48" y="106" font-size="14" font-weight="700" fill="#1e3a8a">Administrator's browser (your device)</text>
  <rect x="48" y="120" width="374" height="326" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="62" y="142" font-size="13" font-weight="600" fill="#0f172a">EntraCompass single-page app</text>
  <g font-size="12" fill="#0f172a">
    <rect x="62" y="154" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="74" y="177" font-weight="600">MSAL (auth code + PKCE)</text><text x="74" y="196" fill="#475569">no client secret</text>
    <rect x="240" y="154" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="252" y="177" font-weight="600">Graph collector</text><text x="252" y="196" fill="#475569">bulk paging, retry on 429</text>
    <rect x="62" y="226" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="74" y="249" font-weight="600">Analyzer</text><text x="74" y="268" fill="#475569">findings, scores, answers</text>
    <rect x="240" y="226" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="252" y="249" font-weight="600">Agents and permissions</text><text x="252" y="268" fill="#475569">Agent ID (preview), roles</text>
    <rect x="62" y="298" width="170" height="62" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="74" y="321" font-weight="600">Purview cross-checks</text><text x="74" y="340" fill="#475569">labels, DLP vs CA</text>
    <rect x="240" y="298" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="252" y="321" font-weight="600">What-if engine</text><text x="252" y="340" fill="#475569">people, guests, agents</text>
    <rect x="62" y="370" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="74" y="393" font-weight="600">Report builder</text><text x="74" y="412" fill="#475569">HTML / print to PDF</text>
    <rect x="240" y="370" width="170" height="62" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="252" y="393" font-weight="600">AI summary (optional)</text><text x="252" y="412" fill="#475569">counts only, names removed</text>
  </g>
  <rect x="48" y="460" width="374" height="64" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="62" y="484" font-size="12.5" font-weight="600" fill="#065f46">sessionStorage</text>
  <text x="62" y="504" font-size="12" fill="#065f46">config, scan, tags, Purview export, theme; cleared on close</text>
  <rect x="48" y="536" width="374" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="62" y="560" font-size="12.5" font-weight="600" fill="#0f172a">Downloads you choose to make</text>
  <text x="62" y="580" font-size="12" fill="#475569">report (HTML / PDF), CSV exports, JSON results, tags</text>
  <rect x="48" y="612" width="374" height="48" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-dasharray="5 4"/>
  <text x="62" y="633" font-size="12.5" font-weight="600" fill="#4c1d95">Purview export (optional JSON file)</text>
  <text x="62" y="651" font-size="12" fill="#5b21b6">opened with the File API, parsed in the page, never uploaded</text>

  <!-- Microsoft -->
  <rect x="600" y="80" width="370" height="96" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
  <text x="618" y="106" font-size="14" font-weight="700" fill="#0f172a">Microsoft Entra ID</text>
  <text x="618" y="126" font-size="12" fill="#475569">login.microsoftonline.com</text>
  <text x="618" y="146" font-size="12" fill="#475569">Your tenant, your app registration (SPA)</text>
  <text x="618" y="164" font-size="12" fill="#475569">Your Conditional Access applies to the sign-in</text>

  <rect x="600" y="196" width="370" height="150" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
  <text x="618" y="222" font-size="14" font-weight="700" fill="#0f172a">Microsoft Graph</text>
  <text x="618" y="242" font-size="12" fill="#475569">graph.microsoft.com (v1.0 and beta)</text>
  <text x="618" y="262" font-size="12" fill="#475569">Delegated, read-only: CA policies, named locations,</text>
  <text x="618" y="280" font-size="12" fill="#475569">apps, app registrations, permissions, role assignments,</text>
  <text x="618" y="298" font-size="12" fill="#475569">agent identities, blueprints, agent users, agent risk,</text>
  <text x="618" y="316" font-size="12" fill="#475569">sensitivity labels, application sign-in activity</text>
  <text x="618" y="334" font-size="11" fill="#64748b">Agent, risk and label reads are optional permissions</text>

  <!-- Cloudflare -->
  <rect x="600" y="366" width="370" height="216" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
  <text x="618" y="392" font-size="14" font-weight="700" fill="#7c2d12">Cloudflare (aboutcloud.io)</text>
  <rect x="614" y="404" width="342" height="54" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="626" y="426" font-size="12" font-weight="600" fill="#0f172a">Edge: WAF rules, rate limit, geo block</text>
  <text x="626" y="445" font-size="12" fill="#475569">TLS 1.2+ (1.3 preferred), HSTS preload, CSP</text>
  <rect x="614" y="466" width="342" height="48" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="626" y="487" font-size="12" font-weight="600" fill="#0f172a">Pages: static app files (built from GitHub main)</text>
  <text x="626" y="504" font-size="12" fill="#475569">no tenant data, no database, no logs of results</text>
  <rect x="614" y="522" width="342" height="48" rx="8" fill="#ffffff" stroke="#fdba74" stroke-dasharray="5 4"/>
  <text x="626" y="543" font-size="12" font-weight="600" fill="#0f172a">Pages Function /ai/ask, Workers AI</text>
  <text x="626" y="560" font-size="12" fill="#475569">optional, origin-locked, rate-limited, stateless</text>

  <!-- Purview -->
  <rect x="600" y="600" width="370" height="74" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="618" y="624" font-size="14" font-weight="700" fill="#4c1d95">Microsoft Purview (optional)</text>
  <text x="618" y="644" font-size="12" fill="#5b21b6">Security &amp; Compliance PowerShell, run by you:</text>
  <text x="618" y="662" font-size="12" fill="#5b21b6">Export-PurviewForEntraCompass.ps1 (read-only)</text>

  <!-- Arrows -->
  <g font-size="12" font-weight="600">
    <line x1="440" y1="130" x2="598" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
    <text x="452" y="122" fill="#334155">1  Sign in (PKCE)</text>
    <line x1="440" y1="270" x2="598" y2="270" stroke="#047857" stroke-width="2.5" marker-end="url(#g)" marker-start="url(#g)"/>
    <text x="452" y="262" fill="#047857">2  Read-only Graph</text>
    <text x="452" y="290" fill="#047857" font-weight="400">bearer token, direct</text>
    <line x1="598" y1="490" x2="442" y2="490" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="452" y="482" fill="#334155">3  App files (HTTPS)</text>
    <line x1="440" y1="546" x2="598" y2="546" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#o)"/>
    <text x="452" y="538" fill="#c2410c">4  Optional AI</text>
    <text x="452" y="566" fill="#c2410c" font-weight="400">aggregated summary</text>
    <line x1="598" y1="636" x2="424" y2="636" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#p)"/>
    <text x="452" y="628" fill="#6d28d9">5  Export file</text>
    <text x="452" y="656" fill="#6d28d9" font-weight="400">via your disk, not the web</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <line x1="30" y1="704" x2="62" y2="704" stroke="#047857" stroke-width="2.5"/><text x="70" y="708">Tenant data (browser and Microsoft only)</text>
    <line x1="300" y1="704" x2="332" y2="704" stroke="#334155" stroke-width="2"/><text x="340" y="708">Sign-in and app delivery</text>
    <line x1="510" y1="704" x2="542" y2="704" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/><text x="550" y="708">Optional, minimised data</text>
    <line x1="730" y1="704" x2="762" y2="704" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4"/><text x="770" y="708">Optional local file</text>
    <text x="30" y="738" fill="#64748b">Graph traffic does not pass through Cloudflare. Nothing is written back to the tenant. The Purview file never leaves your device.</text>
  </g>
</svg>
