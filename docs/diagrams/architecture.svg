<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">EntraCompass architecture</title>
  <desc id="d">The app runs in the administrator's browser. It signs in to Microsoft Entra ID with PKCE, reads Microsoft Graph directly, and keeps data in sessionStorage. Cloudflare only serves the app files and, optionally, an AI endpoint that receives an aggregated summary.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1000" height="640" rx="14" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0f172a">EntraCompass architecture</text>
  <text x="30" y="60" font-size="12.5" fill="#475569">Browser-only, read-only. Tenant data flows only between your browser and Microsoft.</text>

  <!-- Browser -->
  <rect x="30" y="80" width="410" height="470" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="48" y="106" font-size="14" font-weight="700" fill="#1e3a8a">Administrator's browser (your device)</text>
  <rect x="48" y="120" width="374" height="262" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="62" y="142" font-size="13" font-weight="600" fill="#0f172a">EntraCompass single-page app</text>
  <g font-size="12" fill="#0f172a">
    <rect x="62" y="154" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="74" y="177" font-weight="600">MSAL (auth code + PKCE)</text><text x="74" y="196" fill="#475569">no client secret</text>
    <rect x="240" y="154" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="252" y="177" font-weight="600">Graph collector</text><text x="252" y="196" fill="#475569">paging, retry on 429</text>
    <rect x="62" y="226" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="74" y="249" font-weight="600">Analyzer</text><text x="74" y="268" fill="#475569">findings, scores, answers</text>
    <rect x="240" y="226" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="252" y="249" font-weight="600">What-if engine</text><text x="252" y="268" fill="#475569">policy evaluation</text>
    <rect x="62" y="298" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="74" y="321" font-weight="600">Report builder</text><text x="74" y="340" fill="#475569">HTML / print to PDF</text>
    <rect x="240" y="298" width="170" height="62" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="252" y="321" font-weight="600">AI summary (optional)</text><text x="252" y="340" fill="#475569">counts only, names removed</text>
  </g>
  <rect x="48" y="396" width="374" height="64" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="62" y="420" font-size="12.5" font-weight="600" fill="#065f46">sessionStorage</text>
  <text x="62" y="440" font-size="12" fill="#065f46">config, scan results, crown-jewel tags. Cleared on tab close.</text>
  <rect x="48" y="472" width="374" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="62" y="496" font-size="12.5" font-weight="600" fill="#0f172a">Downloads you choose to make</text>
  <text x="62" y="516" font-size="12" fill="#475569">report (HTML / PDF), CSV exports, JSON results, tags</text>

  <!-- Microsoft -->
  <rect x="600" y="80" width="370" height="96" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
  <text x="618" y="106" font-size="14" font-weight="700" fill="#0f172a">Microsoft Entra ID</text>
  <text x="618" y="126" font-size="12" fill="#475569">login.microsoftonline.com</text>
  <text x="618" y="146" font-size="12" fill="#475569">Your tenant, your app registration (SPA)</text>
  <text x="618" y="164" font-size="12" fill="#475569">Your Conditional Access applies to the sign-in</text>

  <rect x="600" y="196" width="370" height="118" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
  <text x="618" y="222" font-size="14" font-weight="700" fill="#0f172a">Microsoft Graph</text>
  <text x="618" y="242" font-size="12" fill="#475569">graph.microsoft.com (v1.0 and beta)</text>
  <text x="618" y="262" font-size="12" fill="#475569">Delegated, read-only: CA policies, named locations,</text>
  <text x="618" y="280" font-size="12" fill="#475569">apps, app registrations, users and groups in policies,</text>
  <text x="618" y="298" font-size="12" fill="#475569">application sign-in activity</text>

  <!-- Cloudflare -->
  <rect x="600" y="334" width="370" height="216" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
  <text x="618" y="360" font-size="14" font-weight="700" fill="#7c2d12">Cloudflare (aboutcloud.io)</text>
  <rect x="614" y="372" width="342" height="54" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="626" y="394" font-size="12" font-weight="600" fill="#0f172a">Edge: WAF rules, rate limit, geo block</text>
  <text x="626" y="413" font-size="12" fill="#475569">TLS 1.2+ (1.3 preferred), HSTS preload, CSP</text>
  <rect x="614" y="434" width="342" height="48" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="626" y="455" font-size="12" font-weight="600" fill="#0f172a">Pages: static app files</text>
  <text x="626" y="472" font-size="12" fill="#475569">no tenant data, no database, no logs of results</text>
  <rect x="614" y="490" width="342" height="48" rx="8" fill="#ffffff" stroke="#fdba74" stroke-dasharray="5 4"/>
  <text x="626" y="511" font-size="12" font-weight="600" fill="#0f172a">Pages Function /ai/ask, Workers AI</text>
  <text x="626" y="528" font-size="12" fill="#475569">optional, origin-locked, rate-limited, stateless</text>

  <!-- Arrows -->
  <g font-size="12" font-weight="600">
    <line x1="440" y1="130" x2="598" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
    <text x="452" y="122" fill="#334155">1  Sign in (PKCE)</text>
    <line x1="440" y1="252" x2="598" y2="252" stroke="#047857" stroke-width="2.5" marker-end="url(#g)" marker-start="url(#g)"/>
    <text x="452" y="244" fill="#047857">2  Read-only Graph</text>
    <text x="452" y="272" fill="#047857" font-weight="400">bearer token, direct</text>
    <line x1="598" y1="458" x2="442" y2="458" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="452" y="450" fill="#334155">3  App files (HTTPS)</text>
    <line x1="440" y1="514" x2="598" y2="514" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#o)"/>
    <text x="452" y="506" fill="#c2410c">4  Optional AI</text>
    <text x="452" y="534" fill="#c2410c" font-weight="400">aggregated summary</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <line x1="30" y1="584" x2="62" y2="584" stroke="#047857" stroke-width="2.5"/><text x="70" y="588">Tenant data (browser and Microsoft only)</text>
    <line x1="330" y1="584" x2="362" y2="584" stroke="#334155" stroke-width="2"/><text x="370" y="588">Sign-in and app delivery</text>
    <line x1="560" y1="584" x2="592" y2="584" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/><text x="600" y="588">Optional, minimised data</text>
    <text x="30" y="616" fill="#64748b">Graph traffic does not pass through Cloudflare. Nothing is written back to the tenant.</text>
  </g>
</svg>
